name: Build and Release Unsigned IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and release unsigned IPA
    runs-on: macos-26
    timeout-minutes: 30
    env:
      PROJECT_PATH: igo3.xcodeproj
      SCHEME_NAME: igo3
      DERIVED_DATA_PATH: build/DerivedData
      IPA_PATH: build/igo3-unsigned.ipa

    steps:
      - name: Check out commit
        uses: actions/checkout@v7

      - name: Build unsigned device app
        run: |
          xcodebuild build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Package unsigned IPA
        run: |
          APP_PATH="$DERIVED_DATA_PATH/Build/Products/Release-iphoneos/igo3.app"
          test -d "$APP_PATH"
          mkdir -p build/package/Payload
          cp -R "$APP_PATH" build/package/Payload/
          ditto -c -k --sequesterRsrc --keepParent \
            build/package/Payload \
            "$IPA_PATH"
          test -s "$IPA_PATH"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TAG="build-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          gh release create "$TAG" "$IPA_PATH" \
            --target "$GITHUB_SHA" \
            --title "Build ${GITHUB_RUN_NUMBER} (${SHORT_SHA})" \
            --notes "Unsigned iOS 26 IPA for commit $GITHUB_SHA. Sign before installing on a physical device." \
            --latest

